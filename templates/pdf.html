{% extends 'layout.html' %}
{% block content %}
<h1>Upload PDFs</h1>

<form action="/pdf" method="post" enctype="multipart/form-data">
    <input type="file" name="pdf" multiple accept="application/pdf" required>
    <input type="text" name="question" placeholder="Ask a question..." required>
    <button type="submit">Submit</button>
</form>

{% if response %}
<div class="response-container">
    <h2>Response:</h2>
    <md-block>
        {{ response | safe }}
    </md-block>
</div>
{% endif %}

<!-- Include md-block script -->
<script type="module" src="https://md-block.verou.me/md-block.js"></script>
{% endblock %}
